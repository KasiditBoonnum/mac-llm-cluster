model_list:
  - model_name: phi4:latest
    litellm_params:
      model: openai/phi4:latest
      api_base: http://localhost:8080/v1
      api_key: none

  - model_name: qwen2.5:32b-instruct-q4_K_M
    litellm_params:
      model: openai/qwen2.5:32b-instruct-q4_K_M
      api_base: http://localhost:8080/v1
      api_key: none

  - model_name: deepseek-coder:33b-instruct-q4_K_M
    litellm_params:
      model: openai/deepseek-coder:33b-instruct-q4_K_M
      api_base: http://localhost:8080/v1
      api_key: none

  - model_name: exo:Qwen3.6-35B-A3B-8bit
    litellm_params:
      model: openai/exo:Qwen3.6-35B-A3B-8bit
      api_base: http://localhost:8080/v1
      api_key: none

  # Auto-routing group: LiteLLM picks the least-busy model
  - model_name: auto
    litellm_params:
      model: openai/phi4:latest
      api_base: http://localhost:8080/v1
      api_key: none

  - model_name: auto
    litellm_params:
      model: openai/qwen2.5:32b-instruct-q4_K_M
      api_base: http://localhost:8080/v1
      api_key: none

router_settings:
  routing_strategy: least-busy
  timeout: 120
  retry_after: 0


general_settings:
  master_key: sk-llm-cluster
