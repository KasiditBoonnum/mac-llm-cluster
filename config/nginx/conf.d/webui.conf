# Web UI with authentication

limit_req_zone $binary_remote_addr zone=webui_limit:10m rate=100r/h;

server {
    listen 80;
    server_name llm-01.local 192.168.10.11;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name llm-01.local 192.168.10.11;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    limit_req zone=webui_limit burst=20 nodelay;

    auth_basic "LLM Cluster - Login Required";
    auth_basic_user_file /opt/homebrew/etc/nginx/auth/webui.htpasswd;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}
