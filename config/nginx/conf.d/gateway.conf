# AI Gateway API

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/h;

server {
    listen 8443 ssl http2;
    server_name llm-01.local 192.168.10.11;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/nginx.key;

    limit_req zone=api_limit burst=50 nodelay;

    location /v1/ {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location /health {
        proxy_pass http://localhost:8082/health;
    }
}
