global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # Node 1 (localhost - Prometheus runs here)
  - job_name: 'node1-system'
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: {instance: 'llm-01', node: 'node1'}
  - job_name: 'node1-mac'
    static_configs:
      - targets: ['127.0.0.1:9101']
        labels: {instance: 'llm-01', node: 'node1'}
  - job_name: 'node1-inference'
    static_configs:
      - targets: ['127.0.0.1:9102']
        labels: {instance: 'llm-01', node: 'node1'}

  # Node 2
  - job_name: 'node2-system'
    static_configs:
      - targets: ['192.168.10.12:9100']
        labels: {instance: 'llm-02', node: 'node2'}
  - job_name: 'node2-mac'
    static_configs:
      - targets: ['192.168.10.12:9101']
        labels: {instance: 'llm-02', node: 'node2'}
  - job_name: 'node2-inference'
    static_configs:
      - targets: ['192.168.10.12:9102']
        labels: {instance: 'llm-02', node: 'node2'}

  # Node 3
  - job_name: 'node3-system'
    static_configs:
      - targets: ['192.168.10.13:9100']
        labels: {instance: 'llm-03', node: 'node3'}
  - job_name: 'node3-mac'
    static_configs:
      - targets: ['192.168.10.13:9101']
        labels: {instance: 'llm-03', node: 'node3'}
  - job_name: 'node3-inference'
    static_configs:
      - targets: ['192.168.10.13:9102']
        labels: {instance: 'llm-03', node: 'node3'}
