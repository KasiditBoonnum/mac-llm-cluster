# RAG Admin UI — port 8444

server {
    listen 8444 ssl;
    http2 on;
    server_name llm-01.local 192.168.10.11;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    auth_basic "LLM Cluster — RAG Admin";
    auth_basic_user_file /opt/homebrew/etc/nginx/auth/webui.htpasswd;

    client_max_body_size 200m;

    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
